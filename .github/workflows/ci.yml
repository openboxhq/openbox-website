name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Check and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run check
      - name: Dependency audit (high and critical)
        run: npm run audit
      - name: Build
        run: npm run build
      - name: Guard against leaked emails and inline scripts
        run: |
          if grep -rEo '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[a-z]{2,}' dist; then
            echo "::error::An email address is exposed in the built site"; exit 1
          fi
          if grep -rEo '<script(\s[^>]*)?>[^<]' dist --include='*.html' | grep -v 'src='; then
            echo "::error::Inline script found; the Content-Security-Policy forbids it"; exit 1
          fi
